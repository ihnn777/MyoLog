<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MyoLog - Fitness & Progression Tracker</title>
<!-- Chart.js CDN for progression graphs -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* --- CSS VARIABLES & THEMING --- */
:root {
/* Cyber Dark Theme (Homepage, Graphs, Workout History) */
--bg-dark: #101216;
--card-dark: #181b22;
--card-border-dark: #262a36;
--accent-neon: #00ff88;
--accent-cyan: #00e5ff;
--accent-blue: #2563eb; /* Solid Blue Color */
--text-main: #f0f2f5;
--text-muted: #8a8f9e;
--radius: 16px;
--font-stack: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;

/* Sleek Minimalist Theme (Pop-Up Modal Windows) */
--modal-bg: #16181f;
--modal-card: #20232d;
--modal-border: #33384a;
--modal-accent: #ffffff;
--modal-subtext: #a0a5b5;
}

@media (prefers-color-scheme: light) {
:root {
--bg-dark: #f4f6f9;
--card-dark: #ffffff;
--card-border-dark: #e1e4ea;
--accent-neon: #00a859;
--accent-cyan: #0088cc;
--accent-blue: #1d4ed8;
--text-main: #111827;
--text-muted: #6b7280;

--modal-bg: #ffffff;
--modal-card: #f8f9fa;
--modal-border: #cbd5e1;
--modal-accent: #0f172a;
--modal-subtext: #64748b;
}
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: var(--font-stack);
-webkit-tap-highlight-color: transparent;
}

body {
background-color: var(--bg-dark);
color: var(--text-main);
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
padding-bottom: 30px;
overflow-x: hidden;
}

/* --- LAYOUT CONTAINERS --- */
.app-container {
width: 100%;
max-width: 480px;
padding: 16px;
display: flex;
flex-direction: column;
gap: 16px;
}

/* --- HEADER & TOP BAR --- */
header {
display: flex;
flex-direction: column;
gap: 10px;
padding-bottom: 4px;
}

.header-top-row {
display: flex;
justify-content: space-between;
align-items: center;
}

h1 {
font-size: 1.5rem;
font-weight: 900;
letter-spacing: -0.5px;
color: var(--accent-blue);
background: none;
-webkit-text-fill-color: initial;
}

.header-actions {
display: flex;
gap: 6px;
}

.icon-btn {
background: var(--card-dark);
border: 1px solid var(--card-border-dark);
color: var(--text-main);
padding: 8px 12px;
border-radius: 12px;
font-size: 0.8rem;
font-weight: 600;
cursor: pointer;
display: flex;
align-items: center;
gap: 4px;
transition: all 0.2s ease;
}

.icon-btn:active {
transform: scale(0.95);
border-color: var(--accent-neon);
}

/* Non-intrusive Backup Banner */
.backup-banner {
background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 229, 255, 0.15));
border: 1px solid var(--accent-neon);
border-radius: var(--radius);
padding: 12px 16px;
display: none;
justify-content: space-between;
align-items: center;
font-size: 0.85rem;
}

.backup-banner button {
background: var(--accent-neon);
color: #000;
border: none;
padding: 6px 12px;
border-radius: 8px;
font-weight: 700;
cursor: pointer;
}

/* --- RECENT EXERCISES BAR --- */
.recent-bar {
display: flex;
flex-direction: column;
gap: 8px;
}

.section-title {
font-size: 0.75rem;
text-transform: uppercase;
letter-spacing: 1px;
color: var(--text-muted);
font-weight: 800;
}

.recent-chips {
display: flex;
gap: 8px;
overflow-x: auto;
padding-bottom: 4px;
scrollbar-width: none;
}

.recent-chip {
background: var(--card-dark);
border: 1px solid var(--card-border-dark);
color: var(--text-main);
padding: 8px 14px;
border-radius: 20px;
font-size: 0.85rem;
white-space: nowrap;
cursor: pointer;
font-weight: 600;
transition: border-color 0.2s ease;
}

.recent-chip:active {
border-color: var(--accent-neon);
}

/* --- BODY MAP CARD --- */
.body-map-card {
background: var(--card-dark);
border: 1px solid var(--card-border-dark);
border-radius: var(--radius);
padding: 16px;
display: flex;
flex-direction: column;
align-items: center;
gap: 8px;
box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}

.map-legend {
display: flex;
justify-content: space-between;
width: 100%;
padding: 0 16px;
font-size: 0.75rem;
font-weight: 800;
letter-spacing: 1px;
color: var(--text-muted);
}

/* SVG Silhouette Styling */
.svg-container {
width: 100%;
max-width: 320px;
height: 400px;
position: relative;
}

svg {
width: 100%;
height: 100%;
filter: drop-shadow(0px 4px 16px rgba(0,0,0,0.4));
}

/* Robotic Plate Styling with Rounded Corners */
.muscle-plate {
fill: #222634;
stroke: #33384a;
stroke-width: 1.5;
cursor: pointer;
rx: 8px;
ry: 8px;
transition: all 0.2s ease;
}

.muscle-plate:hover, .muscle-plate:active {
fill: var(--accent-neon);
stroke: var(--accent-cyan);
filter: drop-shadow(0px 0px 10px var(--accent-neon));
}

.plate-label {
font-size: 8px;
font-weight: 800;
fill: #8a8f9e;
pointer-events: none;
text-anchor: middle;
dominant-baseline: central;
text-transform: uppercase;
letter-spacing: 0.5px;
}

.muscle-plate:hover + .plate-label,
.muscle-plate:active + .plate-label {
fill: #000000;
}

/* --- FLOATING POP-UP MODAL WINDOW --- */
.modal-overlay {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
background: rgba(0, 0, 0, 0.75);
backdrop-filter: blur(8px);
display: none;
justify-content: center;
align-items: center;
padding: 16px;
z-index: 1000;
opacity: 0;
transition: opacity 0.25s ease;
}

.modal-overlay.active {
display: flex;
opacity: 1;
}

.modal-window {
background: var(--modal-bg);
border-radius: 24px;
width: 100%;
max-width: 460px;
max-height: 85vh;
display: flex;
flex-direction: column;
overflow: hidden;
border: 2px solid var(--modal-border);
box-shadow: 0 16px 48px rgba(0,0,0,0.7);
transform: scale(0.95) translateY(10px);
transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
}

.modal-overlay.active .modal-window {
transform: scale(1) translateY(0);
}

.modal-header {
padding: 16px 20px;
border-bottom: 1px solid var(--modal-border);
display: flex;
justify-content: space-between;
align-items: center;
background: var(--modal-card);
flex-shrink: 0;
}

.modal-title-group {
display: flex;
align-items: center;
gap: 10px;
}

.modal-title {
font-size: 1.1rem;
font-weight: 700;
color: var(--modal-accent);
}

.close-btn {
background: transparent;
border: none;
color: var(--modal-subtext);
font-size: 1.5rem;
cursor: pointer;
line-height: 1;
}

.modal-body {
padding: 20px;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
overscroll-behavior: contain;
display: flex;
flex-direction: column;
gap: 18px;
flex: 1;
}

.search-input {
width: 100%;
background: var(--modal-card);
border: 1px solid var(--modal-border);
border-radius: 12px;
padding: 12px 16px;
color: var(--modal-accent);
font-size: 0.95rem;
outline: none;
}

.search-input:focus {
border-color: var(--modal-subtext);
}

.exercise-list {
display: flex;
flex-direction: column;
gap: 8px;
}

.exercise-item {
background: var(--modal-card);
border: 1px solid var(--modal-border);
padding: 14px 16px;
border-radius: 14px;
display: flex;
justify-content: space-between;
align-items: center;
cursor: pointer;
color: var(--modal-accent);
font-weight: 600;
transition: background 0.2s ease;
}

.exercise-item:active {
background: var(--modal-border);
}

/* Custom Exercise Box */
.custom-ex-card {
background: var(--modal-card);
border: 1px dashed var(--modal-border);
border-radius: 16px;
padding: 14px;
display: flex;
flex-direction: column;
gap: 10px;
margin-top: 8px;
}

.custom-input-row {
display: flex;
gap: 8px;
}

/* EXERCISE LOGGING & GRAPH VIEW */
.graph-card {
background: var(--modal-card);
border: 1px solid var(--modal-border);
border-radius: 16px;
padding: 12px;
height: 180px;
}

.variation-select-group {
display: flex;
gap: 8px;
}

.select-style {
flex: 1;
background: var(--modal-card);
border: 1px solid var(--modal-border);
color: var(--modal-accent);
padding: 10px 12px;
border-radius: 12px;
font-size: 0.9rem;
outline: none;
}

/* Logging Controls */
.logging-form {
background: var(--modal-card);
border: 1px solid var(--modal-border);
border-radius: 18px;
padding: 16px;
display: flex;
flex-direction: column;
gap: 14px;
}

.input-row {
display: flex;
gap: 12px;
}

.input-group {
flex: 1;
display: flex;
flex-direction: column;
gap: 6px;
}

.input-label {
font-size: 0.75rem;
text-transform: uppercase;
font-weight: 700;
color: var(--modal-subtext);
}

.field-with-unit {
display: flex;
gap: 6px;
}

.num-input {
width: 100%;
background: var(--modal-bg);
border: 1px solid var(--modal-border);
color: var(--modal-accent);
padding: 12px;
border-radius: 10px;
font-size: 1.1rem;
font-weight: 700;
outline: none;
box-sizing: border-box;
}

/* Date input styling to fit inside container padding */
input[type="date"].num-input {
max-width: 100%;
appearance: none;
-webkit-appearance: none;
padding: 10px 12px;
}

.unit-select {
background: var(--modal-bg);
border: 1px solid var(--modal-border);
color: var(--modal-accent);
padding: 0 8px;
border-radius: 10px;
font-weight: 600;
}

/* Quick Increment Chips - Coloured Button Style */
.increment-chips {
display: flex;
gap: 6px;
justify-content: space-between;
}

.chip-btn {
flex: 1;
background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 229, 255, 0.15));
border: 1px solid var(--accent-neon);
color: var(--accent-neon);
padding: 10px 0;
border-radius: 10px;
font-size: 0.85rem;
font-weight: 800;
cursor: pointer;
transition: all 0.15s ease;
}

.chip-btn:active {
background: var(--accent-neon);
color: #000;
transform: scale(0.96);
}

.save-btn {
background: var(--modal-accent);
color: var(--modal-bg);
border: none;
padding: 14px;
border-radius: 12px;
font-size: 1rem;
font-weight: 800;
cursor: pointer;
width: 100%;
transition: opacity 0.2s ease;
}

.save-btn:active {
opacity: 0.8;
}

/* Scrollable History Log */
.history-card {
background: var(--modal-card);
border: 1px solid var(--modal-border);
border-radius: 16px;
padding: 12px;
max-height: 160px;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 8px;
}

.history-item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 6px 0;
border-bottom: 1px solid var(--modal-border);
font-size: 0.85rem;
}

.history-item:last-child {
border-bottom: none;
}

.del-btn {
color: #ff4d4d;
background: transparent;
border: none;
cursor: pointer;
font-size: 0.8rem;
}
</style>
</head>
<body>

<div class="app-container">
<!-- HOMEPAGE HEADER & TOP BACKUP BAR -->
<header>
<div class="header-top-row">
<h1>MYOLOG</h1>
<div class="header-actions">
<button class="icon-btn" onclick="openWorkoutHistory()">📅 History</button>
<button class="icon-btn" onclick="exportData()">💾 Backup</button>
<button class="icon-btn" onclick="triggerImport()">📥 Import</button>
<input type="file" id="importFileInput" style="display:none;" accept=".json" onchange="importData(event)">
</div>
</div>
</header>

<!-- NON-INTRUSIVE BACKUP BANNER -->
<div id="backupBanner" class="backup-banner">
<span>You've logged 10 new exercises!</span>
<button onclick="exportData()">Save Backup</button>
</div>

<!-- RECENT EXERCISES BAR -->
<div class="recent-bar">
<div class="section-title">Quick Resume</div>
<div id="recentChips" class="recent-chips">
<!-- Dynamically filled by JS -->
</div>
</div>

<!-- ROBOTIC HALF-FRONT / HALF-BACK BODY MAP CARD -->
<div class="body-map-card">
<div class="map-legend">
<span>FRONT</span>
<span>BACK</span>
</div>

<div class="svg-container">
<svg viewBox="0 0 240 380">
<!-- Center Divider Axis -->
<line x1="120" y1="10" x2="120" y2="370" stroke="#262a36" stroke-dasharray="4 4" stroke-width="2"/>

<!-- HEAD / HELMET (SPLIT) -->
<rect x="100" y="14" width="18" height="32" rx="6" fill="#1c1f2b" stroke="#33384a"/>
<rect x="122" y="14" width="18" height="32" rx="6" fill="#1c1f2b" stroke="#33384a"/>

<!-- ================= LEFT HALF: FRONT VIEW ================= -->
<!-- Shoulder (Front) -->
<rect x="28" y="50" width="44" height="44" rx="10" class="muscle-plate" data-muscle="Shoulders"/>
<text x="50" y="72" class="plate-label">Shoulder</text>

<!-- Chest / Pec -->
<rect x="74" y="50" width="44" height="48" rx="8" class="muscle-plate" data-muscle="Chest"/>
<text x="96" y="74" class="plate-label">Pec</text>

<!-- Bicep & Forearm -->
<rect x="28" y="98" width="42" height="50" rx="8" class="muscle-plate" data-muscle="Arms"/>
<text x="49" y="123" class="plate-label">Arm</text>

<!-- Abs / Core -->
<rect x="74" y="102" width="44" height="68" rx="8" class="muscle-plate" data-muscle="Core"/>
<text x="96" y="136" class="plate-label">Abs</text>

<!-- Quad & Adductors -->
<rect x="76" y="174" width="42" height="92" rx="10" class="muscle-plate" data-muscle="Quads"/>
<text x="97" y="214" class="plate-label">
  <tspan x="97" dy="0">Quad</tspan>
  <tspan x="97" dy="10">/Add</tspan>
</text>

<!-- Calf (Front) -->
<rect x="84" y="272" width="34" height="84" rx="10" class="muscle-plate" data-muscle="Calves"/>
<text x="101" y="314" class="plate-label">Calf</text>

<!-- ================= RIGHT HALF: BACK VIEW ================= -->
<!-- Upper Back / Traps -->
<rect x="122" y="50" width="44" height="44" rx="8" class="muscle-plate" data-muscle="Upper Back"/>
<text x="144" y="72" class="plate-label">Upper</text>

<!-- Shoulder / Rear Delt -->
<rect x="168" y="50" width="44" height="44" rx="10" class="muscle-plate" data-muscle="Shoulders"/>
<text x="190" y="72" class="plate-label">Shoulder</text>

<!-- Mid Back & Lats -->
<rect x="122" y="98" width="44" height="44" rx="8" class="muscle-plate" data-muscle="Mid Back"/>
<text x="144" y="120" class="plate-label">
  <tspan x="144" dy="-4">Mid</tspan>
  <tspan x="144" dy="10">/LD</tspan>
</text>

<!-- Tricep & Forearm -->
<rect x="170" y="98" width="42" height="50" rx="8" class="muscle-plate" data-muscle="Arms"/>
<text x="191" y="123" class="plate-label">Tri</text>

<!-- Lower Back (Erectors) -->
<rect x="122" y="146" width="44" height="24" rx="8" class="muscle-plate" data-muscle="Lower Back"/>
<text x="144" y="158" class="plate-label">Lower</text>

<!-- Glute -->
<rect x="122" y="174" width="42" height="42" rx="10" class="muscle-plate" data-muscle="Glutes"/>
<text x="143" y="195" class="plate-label">Glute</text>

<!-- Hamstrings -->
<rect x="122" y="220" width="42" height="46" rx="8" class="muscle-plate" data-muscle="Hamstrings"/>
<text x="143" y="243" class="plate-label">Ham</text>

<!-- Calf (Back) -->
<rect x="122" y="272" width="34" height="84" rx="10" class="muscle-plate" data-muscle="Calves"/>
<text x="139" y="314" class="plate-label">Calf</text>
</svg>
</div>
</div>
</div>

<!-- POP-UP OVERLAY MODAL -->
<div id="appModal" class="modal-overlay">
<div class="modal-window">
<div class="modal-header">
<div class="modal-title-group">
<button id="modalBackBtn" class="icon-btn" style="display:none;" onclick="showMuscleExerciseList()">← Back</button>
<div id="modalTitle" class="modal-title">Muscle Group</div>
</div>
<button class="close-btn" onclick="closeModal()">×</button>
</div>

<div id="modalBody" class="modal-body">
<!-- Dynamic content injected by JS -->
</div>
</div>
</div>

<!-- WORKOUT HISTORY MODAL -->
<div id="historyModal" class="modal-overlay">
<div class="modal-window">
<div class="modal-header">
<div class="modal-title">📅 Workout History</div>
<button class="close-btn" onclick="closeHistoryModal()">×</button>
</div>
<div id="historyModalBody" class="modal-body">
<!-- History session cards injected here -->
</div>
</div>
</div>

<script>
/* --- DATA STRUCTURE & EXERCISE DATABASE --- */
const EXERCISE_DB = {
"Chest": {
isSmall: false,
exercises: ["Bench Press", "Incline Dumbbell Press", "Chest Fly", "Dips", "Push Up", "Serratus Cable Punch"]
},
"Shoulders": {
isSmall: true,
exercises: ["Overhead Shoulder Press", "Lateral Raises", "Front Raises", "Face Pulls", "Rotator Cuff External Rotation"]
},
"Arms": {
isSmall: true,
exercises: ["Bicep Curls", "Hammer Curls", "Wrist Curls"]
},
"Core": {
isSmall: true,
exercises: ["Cable Woodchoppers", "Hanging Leg Raise", "Ab Wheel Rollout", "Russian Twists", "Plank", "Side Plank Hold"]
},
"Quads": {
isSmall: false,
exercises: ["Barbell Squat", "Leg Press", "Leg Extension", "Lunges", "Bulgarian Split Squat", "Machine Inner Thigh Adduction"]
},
"Upper Back": {
isSmall: false,
exercises: ["Barbell Shrugs", "Face Pulls", "Chest-Supported Row"]
},
"Mid Back": {
isSmall: false,
exercises: ["Lat Pulldown", "Seated Cable Row (Wide Grip)", "Seated Cable Row (Narrow Grip)", "Single-Arm Dumbbell Row", "T-Bar Row"]
},
"Lower Back": {
isSmall: false,
exercises: ["Standard Deadlift", "Back Extension", "Good Mornings"]
},
"Glutes": {
isSmall: false,
exercises: ["Hip Thrust", "Bulgarian Split Squat", "Single Leg RDL", "Standard Deadlift", "Romanian Deadlift"]
},
"Hamstrings": {
isSmall: false,
exercises: ["Lying Leg Curl", "Seated Leg Curl", "Romanian Deadlift", "Single Leg RDL", "Standard Deadlift"]
},
"Calves": {
isSmall: true,
exercises: ["Standing Calf Raise", "Seated Calf Raise"]
}
};

const VARIATIONS = ["Machine", "Barbell", "Dumbbell", "Cable", "Bodyweight"];

// App State Management
let initialLogs = localStorage.getItem('myolog_logs') || localStorage.getItem('siuhey_logs') || '[]';
let customExStorage = JSON.parse(localStorage.getItem('myolog_custom_ex') || '{}');

let appState = {
logs: JSON.parse(initialLogs),
customEx: customExStorage,
lastBackupCount: parseInt(localStorage.getItem('myolog_backup_count') || '0'),
currentMuscle: '',
currentExercise: '',
chartInstance: null
};

/* --- INITIALIZATION --- */
document.addEventListener('DOMContentLoaded', () => {
renderRecentChips();
checkBackupPrompt();
setupSvgListeners();
});

function setupSvgListeners() {
document.querySelectorAll('.muscle-plate').forEach(zone => {
zone.addEventListener('click', (e) => {
const muscle = e.target.getAttribute('data-muscle');
openMuscleModal(muscle);
});
});
}

/* Get all exercises (Default + Custom) for a muscle group */
function getAllExercises(muscle) {
const defaults = EXERCISE_DB[muscle] ? EXERCISE_DB[muscle].exercises : [];
const customs = appState.customEx[muscle] || [];
return [...new Set([...defaults, ...customs])];
}

/* --- RECENT CHIPS & BACKUP WARNING --- */
function renderRecentChips() {
const container = document.getElementById('recentChips');
container.innerHTML = '';

const recentNames = [...new Set(appState.logs.slice().reverse().map(l => l.exerciseName))].slice(0, 4);

if (recentNames.length === 0) {
container.innerHTML = '<span style="color:var(--text-muted); font-size:0.8rem;">Tap a muscle plate on the robot map to start!</span>';
return;
}

recentNames.forEach(name => {
const chip = document.createElement('div');
chip.className = 'recent-chip';
chip.textContent = name;
chip.onclick = () => openExerciseLogging(name);
container.appendChild(chip);
});
}

function checkBackupPrompt() {
const unbackedLogs = appState.logs.length - appState.lastBackupCount;
document.getElementById('backupBanner').style.display = unbackedLogs >= 10 ? 'flex' : 'none';
}

/* --- MODAL MANAGEMENT --- */
function openModal() {
document.getElementById('appModal').classList.add('active');
}

function closeModal() {
document.getElementById('appModal').classList.remove('active');
if (appState.chartInstance) {
appState.chartInstance.destroy();
appState.chartInstance = null;
}
}

/* --- STEP 1: MUSCLE EXERCISE LIST VIEW + CUSTOM EXERCISE OPTION --- */
function openMuscleModal(muscle) {
appState.currentMuscle = muscle;
document.getElementById('modalTitle').textContent = muscle;
document.getElementById('modalBackBtn').style.display = 'none';

const exercises = getAllExercises(muscle);

const body = document.getElementById('modalBody');
body.innerHTML = `
<input type="text" class="search-input" placeholder="🔍 Search or filter exercises..." oninput="filterExercises(this.value)">
<div id="exerciseList" class="exercise-list">
${exercises.sort().map(ex => `
<div class="exercise-item" onclick="openExerciseLogging('${ex}')">
<span>${ex}</span>
<span style="color:var(--modal-subtext); font-size:0.8rem;">➔</span>
</div>
`).join('')}
</div>

<!-- Custom Manual Free-Text Exercise Box -->
<div class="custom-ex-card">
<div class="section-title">Can't find your exercise?</div>
<div class="custom-input-row">
<input type="text" id="customExInput" class="search-input" placeholder="+ Add custom exercise name...">
<button class="save-btn" style="width:auto; padding:0 18px; white-space:nowrap;" onclick="addAndLogCustomExercise()">Add</button>
</div>
</div>
`;

openModal();
}

function filterExercises(query) {
const list = document.getElementById('exerciseList');
const muscle = appState.currentMuscle;
const exercises = getAllExercises(muscle);
const filtered = exercises.filter(e => e.toLowerCase().includes(query.toLowerCase()));

list.innerHTML = filtered.map(ex => `
<div class="exercise-item" onclick="openExerciseLogging('${ex}')">
<span>${ex}</span>
<span style="color:var(--modal-subtext); font-size:0.8rem;">➔</span>
</div>
`).join('');
}

function addAndLogCustomExercise() {
const input = document.getElementById('customExInput');
const customName = input.value.trim();
if (!customName) return;

const muscle = appState.currentMuscle;
if (!appState.customEx[muscle]) {
appState.customEx[muscle] = [];
}

if (!appState.customEx[muscle].includes(customName)) {
appState.customEx[muscle].push(customName);
localStorage.setItem('myolog_custom_ex', JSON.stringify(appState.customEx));
}

openExerciseLogging(customName);
}

function showMuscleExerciseList() {
openMuscleModal(appState.currentMuscle);
}

/* Helper to get context-appropriate default variation for first-time entries */
function getContextualDefaultVariation(exerciseName) {
const name = exerciseName.toLowerCase();
if (name.includes("push up") || name.includes("plank") || name.includes("dip") || name.includes("lunge") || name.includes("pull up")) {
return "Bodyweight";
}
if (name.includes("cable") || name.includes("pulldown") || name.includes("row")) {
return "Cable";
}
if (name.includes("dumbbell") || name.includes("curl") || name.includes("lateral raise")) {
return "Dumbbell";
}
if (name.includes("press") || name.includes("extension") || name.includes("fly") || name.includes("hip thrust")) {
return "Machine";
}
if (name.includes("squat") || name.includes("deadlift") || name.includes("bench") || name.includes("shrug")) {
return "Barbell";
}
return "Machine";
}

/* --- STEP 2: EXERCISE LOGGING VIEW --- */
function openExerciseLogging(exerciseName) {
appState.currentExercise = exerciseName;
document.getElementById('modalTitle').textContent = exerciseName;

const backBtn = document.getElementById('modalBackBtn');
backBtn.style.display = 'block';
backBtn.textContent = `← ${appState.currentMuscle || 'Back'}`;

const exerciseLogs = appState.logs.filter(l => l.exerciseName === exerciseName);
const lastLog = exerciseLogs.length > 0 ? exerciseLogs[exerciseLogs.length - 1] : null;

const isSmall = appState.currentMuscle && EXERCISE_DB[appState.currentMuscle]
? EXERCISE_DB[appState.currentMuscle].isSmall
: true;

const increments = isSmall ? [-2, -1, 0.5, 1, 2] : [-10, -2.5, 2.5, 5, 10];

// Variation selection logic: use last log variation if available, otherwise context-based
let defaultVariation = lastLog ? lastLog.variation : getContextualDefaultVariation(exerciseName);

// Reps autofill logic: leave blank for timed exercises (plank/hold), otherwise use last log or default to '10-12'
const exNameLower = exerciseName.toLowerCase();
const isTimedEx = exNameLower.includes("plank") || exNameLower.includes("hold");
let defaultReps = '';
if (!isTimedEx) {
defaultReps = lastLog && lastLog.reps ? lastLog.reps : '10-12';
}

const body = document.getElementById('modalBody');
body.innerHTML = `
<div class="section-title">Past History</div>
<div id="historyLogBox" class="history-card"></div>

<div class="variation-select-group">
<select id="varSelect" class="select-style" onchange="handleVariationOrExerciseChange()">
${VARIATIONS.map(v => `<option value="${v}" ${defaultVariation === v ? 'selected' : ''}>${v}</option>`).join('')}
</select>
</div>

<div class="logging-form">
<div class="input-row">
<div id="weightGroup" class="input-group">
<label class="input-label">Weight</label>
<div class="field-with-unit">
<input type="number" id="weightInput" class="num-input" value="${lastLog && lastLog.weight ? lastLog.weight : 20}" step="0.5">
<select id="unitSelect" class="unit-select">
<option value="kg" ${lastLog && lastLog.unit === 'kg' ? 'selected' : ''}>kg</option>
<option value="lb" ${lastLog && lastLog.unit === 'lb' ? 'selected' : ''}>lb</option>
</select>
</div>
</div>
<div class="input-group">
<label class="input-label">Reps</label>
<input type="text" id="repsInput" class="num-input" value="${defaultReps}">
</div>
</div>

<div id="incrementChipsGroup" class="increment-chips">
${increments.map(inc => `<button class="chip-btn" onclick="adjustWeight(${inc})">${inc > 0 ? '+' : ''}${inc}kg</button>`).join('')}
</div>

<div id="timeGroup" class="input-group" style="display:none;">
<label class="input-label">Duration (Seconds)</label>
<input type="number" id="timeInput" class="num-input" placeholder="e.g. 60" value="${lastLog && lastLog.time ? lastLog.time : ''}">
</div>

<div class="input-group">
<label class="input-label">Date</label>
<input type="date" id="dateInput" class="num-input" value="${new Date().toISOString().split('T')[0]}">
</div>

<button class="save-btn" onclick="saveLogEntry()">Save Entry</button>
</div>

<div class="section-title">Progression Trend</div>
<div class="graph-card">
<canvas id="progressionChart"></canvas>
</div>
`;

openModal();
handleVariationOrExerciseChange();
renderGraph();
renderHistoryBox();
}

function handleVariationOrExerciseChange() {
const selectedVar = document.getElementById('varSelect').value;
const exName = appState.currentExercise.toLowerCase();
const isTimedEx = exName.includes("plank") || exName.includes("hold");

const weightGroup = document.getElementById('weightGroup');
const chipsGroup = document.getElementById('incrementChipsGroup');
const timeGroup = document.getElementById('timeGroup');

if (selectedVar === "Bodyweight") {
weightGroup.style.display = 'none';
chipsGroup.style.display = 'none';

if (isTimedEx) {
timeGroup.style.display = 'flex';
} else {
timeGroup.style.display = 'none';
}
} else {
weightGroup.style.display = 'flex';

if (isTimedEx) {
chipsGroup.style.display = 'none';
timeGroup.style.display = 'flex';
} else {
chipsGroup.style.display = 'flex';
timeGroup.style.display = 'none';
}
}

renderGraph();
}

function adjustWeight(amount) {
const input = document.getElementById('weightInput');
let val = parseFloat(input.value) || 0;
val = Math.max(0, val + amount);
input.value = val;
}

/* --- CHART.JS GRAPH RENDER --- */
function renderGraph() {
const selectedVar = document.getElementById('varSelect').value;
const filteredLogs = appState.logs.filter(l => l.exerciseName === appState.currentExercise && l.variation === selectedVar);

const canvas = document.getElementById('progressionChart');
if (!canvas) return;

const ctx = canvas.getContext('2d');
if (appState.chartInstance) appState.chartInstance.destroy();

const isTimedEx = appState.currentExercise.toLowerCase().includes("plank") || appState.currentExercise.toLowerCase().includes("hold");
const isBodyweight = selectedVar === "Bodyweight";

let chartLabel = 'Max Weight';
let dataPoints = filteredLogs.map(l => l.weight);

if (isTimedEx) {
chartLabel = 'Duration (s)';
dataPoints = filteredLogs.map(l => parseFloat(l.time) || 0);
} else if (isBodyweight) {
chartLabel = 'Reps';
dataPoints = filteredLogs.map(l => parseInt(l.reps) || 0);
}

appState.chartInstance = new Chart(ctx, {
type: 'line',
data: {
labels: filteredLogs.map(l => l.date),
datasets: [{
label: chartLabel,
data: dataPoints,
borderColor: '#00ff88',
backgroundColor: 'rgba(0, 255, 136, 0.1)',
fill: true,
tension: 0.3,
pointRadius: 4
}]
},
options: {
responsive: true,
maintainAspectRatio: false,
plugins: { legend: { display: false } },
scales: {
x: { ticks: { color: '#8a8f9e', font: { size: 10 } }, grid: { display: false } },
y: { ticks: { color: '#8a8f9e', font: { size: 10 } }, grid: { color: '#2e3342' } }
}
}
});
}

/* --- HISTORY BOX & ENTRY DELETION --- */
function renderHistoryBox() {
const container = document.getElementById('historyLogBox');
if (!container) return;

const filtered = appState.logs.filter(l => l.exerciseName === appState.currentExercise).reverse();

if (filtered.length === 0) {
container.innerHTML = '<div style="color:var(--modal-subtext); font-size:0.8rem;">No past entries yet.</div>';
return;
}

container.innerHTML = filtered.map(item => `
<div class="history-item">
<div>
<strong>${item.variation === 'Bodyweight' ? '' : item.weight + ' ' + item.unit + ' × '}${item.reps ? item.reps + ' reps' : ''}${item.time ? ' (' + item.time + 's)' : ''}</strong>
<span style="color:var(--modal-subtext); font-size:0.75rem; margin-left:6px;">(${item.variation})</span>
</div>
<div>
<span style="color:var(--modal-subtext); font-size:0.75rem; margin-right:8px;">${item.date}</span>
<button class="del-btn" onclick="deleteLog('${item.id}')">✕</button>
</div>
</div>
`).join('');
}

function saveLogEntry() {
const selectedVar = document.getElementById('varSelect').value;
const weightVal = selectedVar === 'Bodyweight' ? 0 : (parseFloat(document.getElementById('weightInput').value) || 0);
const timeVal = document.getElementById('timeInput') ? document.getElementById('timeInput').value : '';

const newEntry = {
id: 'log_' + Date.now(),
date: document.getElementById('dateInput').value,
exerciseName: appState.currentExercise,
bodyPart: appState.currentMuscle,
variation: selectedVar,
weight: weightVal,
unit: document.getElementById('unitSelect').value,
reps: document.getElementById('repsInput').value || '',
time: timeVal
};

appState.logs.push(newEntry);
localStorage.setItem('myolog_logs', JSON.stringify(appState.logs));

renderRecentChips();
checkBackupPrompt();
renderGraph();
renderHistoryBox();
}

function deleteLog(id) {
appState.logs = appState.logs.filter(l => l.id !== id);
localStorage.setItem('myolog_logs', JSON.stringify(appState.logs));
renderGraph();
renderHistoryBox();
renderRecentChips();
}

/* --- WORKOUT HISTORY MODAL --- */
function openWorkoutHistory() {
const container = document.getElementById('historyModalBody');
const grouped = {};
appState.logs.forEach(log => {
if (!grouped[log.date]) grouped[log.date] = [];
grouped[log.date].push(log);
});

const dates = Object.keys(grouped).sort().reverse();

if (dates.length === 0) {
container.innerHTML = '<div style="color:var(--modal-subtext); text-align:center;">No completed workouts logged yet.</div>';
} else {
container.innerHTML = dates.map(date => `
<div style="background:var(--modal-card); border:1px solid var(--modal-border); padding:14px; border-radius:14px; margin-bottom:12px;">
<div style="font-weight:800; color:var(--modal-accent); margin-bottom:8px; border-bottom:1px solid var(--modal-border); padding-bottom:4px;">🗓️ ${date}</div>
${grouped[date].map(item => `
<div style="display:flex; justify-content:space-between; font-size:0.85rem; padding:4px 0;">
<span>${item.exerciseName} (${item.variation})</span>
<strong>${item.variation === 'Bodyweight' ? '' : item.weight + item.unit + ' × '}${item.reps}${item.time ? ' (' + item.time + 's)' : ''}</strong>
</div>
`).join('')}
</div>
`).join('');
}

document.getElementById('historyModal').classList.add('active');
}

function closeHistoryModal() {
document.getElementById('historyModal').classList.remove('active');
}

/* --- BACKUP EXPORT & IMPORT --- */
function exportData() {
if (appState.logs.length === 0) {
alert("No workout data logged yet to back up!");
return;
}
const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState.logs));
const downloadAnchor = document.createElement('a');
downloadAnchor.setAttribute("href", dataStr);
downloadAnchor.setAttribute("download", `myolog_backup_${new Date().toISOString().split('T')[0]}.json`);
document.body.appendChild(downloadAnchor);
downloadAnchor.click();
downloadAnchor.remove();

appState.lastBackupCount = appState.logs.length;
localStorage.setItem('myolog_backup_count', appState.lastBackupCount.toString());
checkBackupPrompt();
}

function triggerImport() {
document.getElementById('importFileInput').click();
}

function importData(event) {
const file = event.target.files[0];
if (!file) return;

const reader = new FileReader();
reader.onload = function(e) {
try {
const importedLogs = JSON.parse(e.target.result);
if (Array.isArray(importedLogs)) {
appState.logs = importedLogs;
localStorage.setItem('myolog_logs', JSON.stringify(appState.logs));
renderRecentChips();
alert("Backup restored successfully!");
} else {
alert("Invalid backup file format.");
}
} catch (err) {
alert("Error reading file: " + err.message);
}
};
reader.readAsText(file);
}
</script>
</body>
</html>
